[usage]
timezone = "Europe/Berlin"
refresh_limits_seconds = 300
refresh_usage_seconds = 60
refresh_process_seconds = 15

[usage.providers.codex]
enabled = true
default_profile = "default"
ccusage_enabled = true
ccusage_command = "ccusage"
# Alternative when ccusage is not installed globally:
# ccusage_command = "npx --yes ccusage"
# Optional. Defaults to the OS user cache dir under agent-tools/codex.
# cache_dir = "~/.cache/agent-tools/codex"

[usage.providers.codex.profiles.default]
home = "~/.codex"
label = "codex"

# Add more Codex profiles when needed:
#
# [usage.providers.codex.profiles.work]
# home = "~/.codex-work"
# label = "work"

[usage.providers.claude]
enabled = false
